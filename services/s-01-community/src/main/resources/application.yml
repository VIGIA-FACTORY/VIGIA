spring:
  application:
    name: s-01-community
  threads:
    virtual:
      enabled: true # Java 21 virtual threads (ADR-002)
  datasource:
    # Local defaults; every environment overrides them with SPRING_DATASOURCE_* variables.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vigia_community}
    username: ${SPRING_DATASOURCE_USERNAME:vigia_community}
    password: ${SPRING_DATASOURCE_PASSWORD:vigia_community}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema belongs to Flyway (05.01 §2.2)
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true # RFC 9457 error responses (ADR-033)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VIGIA_ISSUER_URI:http://localhost:8180/realms/vigia}
          jwk-set-uri: ${VIGIA_JWK_SET_URI:http://localhost:8180/realms/vigia/protocol/openid-connect/certs}
          audiences: vigia-api
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:vigia}
    password: ${SPRING_RABBITMQ_PASSWORD:vigia}

vigia:
  cors:
    origins: ${VIGIA_CORS_ORIGINS:http://localhost:5173}
  outbox:
    relay:
      enabled: ${VIGIA_OUTBOX_RELAY_ENABLED:true}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /actuator/health/readiness (ADR-033)
      group:
        readiness:
          include: readinessState, db
  observations:
    key-values:
      application: ${spring.application.name}
