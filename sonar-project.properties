# SonarQube quality gate, stage 5 of 05.01 §3.2, run on SonarCloud (free for public repositories).
# The organization and project keys must match the ones created in SonarCloud for VIGIA-FACTORY/VIGIA.
sonar.organization=vigia-factory
sonar.projectKey=VIGIA-FACTORY_VIGIA
sonar.projectName=VIGIA
sonar.sources=.
sonar.exclusions=**/build/**,**/node_modules/**,**/.turbo/**,**/src/test/**,tools/service-template/styles/**
sonar.tests=.
sonar.test.inclusions=**/src/test/**
sonar.java.binaries=**/build/classes/java/main
sonar.java.test.binaries=**/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml
sonar.qualitygate.wait=true
