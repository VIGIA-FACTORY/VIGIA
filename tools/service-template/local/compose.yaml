# Adds this service to the local environment of docker-compose.yml (05.01 §4):
#   docker compose -f docker-compose.yml -f tools/service-template/local/compose.yaml up --build
# Paths are relative to the repository root, where docker-compose.yml lives.
services:
  postgres:
    volumes:
      - ./tools/service-template/local/create-database.sql:/docker-entrypoint-initdb.d/service-template.sql:ro

  service-template:
    build:
      context: .
      dockerfile: tools/service-template/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vigia_template
    ports:
      - "8100:8080" # host port 81NN for service S-NN, so several services can run together
    depends_on:
      postgres:
        condition: service_healthy
