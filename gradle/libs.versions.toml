# Single place for Java dependency versions (ADR-002 version policy; baseline in 03.04.01 §11).
# Versions were checked in the Spring Boot 4.1 compatibility spike (SCRUM-96, 2026-11-26).
# Spring-managed libraries take their version from the Spring Boot BOM and are declared without one.

[versions]
spring-boot = "4.2.0"
spring-ai = "2.1.0"
springdoc = "3.2.1"
resilience4j = "2.4.0"
aws-sdk = "2.59.10"
archunit = "1.5.1"
logstash-logback-encoder = "9.0"
testcontainers = "2.0.5"
testcontainers-keycloak = "4.4.1"
# Build and quality tooling (05.01 §3.2, stages 1, 2 and 9)
spotless = "8.12.0"
palantir-java-format = "2.103.0"
checkstyle = "14.4.0"
jacoco = "0.8.16"
jib = "3.5.4"

[libraries]
# Spring Boot starters (versions from the Spring Boot BOM)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
spring-boot-resttestclient = { module = "org.springframework.boot:spring-boot-resttestclient" }

# Data
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Observability (ADR-024, ADR-043)
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

# Resilience and API documentation
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Spring AI (S-13)
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

# AWS SDK v2 (DynamoDB, S3)
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }

# Tests
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainers-keycloak" }

# Gradle plugins used by tools/build-logic (put on the convention plugins' classpath).
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
